<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun With Primes</title>
    <link rel="stylesheet" href="css/styles.css?v=20251112002">
    <meta name="description" content="Infinite scrolling prime number generator">
    <meta name="keywords" content="prime numbers, mathematics">
    <meta name="theme-color" content="#6366f1">
</head>
<body>
    <!-- Gradient Background Overlay -->
    <div class="gradient-overlay"></div>

    <!-- Main Content -->
    <main id="main-content">
        <header class="hero-section">
            <h1 class="hero-title">Fun With Primes</h1>
        </header>

        <section class="prime-section">
            <div id="prime-container"></div>
            <div id="loading-indicator" class="loading-indicator" style="display: none;">
                <div class="loading-spinner"></div>
                <span>Generating primes...</span>
            </div>
            <div id="scroll-hint" class="scroll-hint">
                <svg class="scroll-icon" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/>
                </svg>
                Scroll to generate more primes
            </div>
        </section>
    </main>

    <!-- Prime Details Modal -->
    <div id="prime-modal" class="modal" style="display: none;">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <button class="close" aria-label="Close modal">&times;</button>
            <h2 class="modal-title">Prime Number Details</h2>
            <div id="modal-prime-info"></div>
        </div>
    </div>

    <script src="js/app.js?v=20251112001"></script>
</body>
</html>
